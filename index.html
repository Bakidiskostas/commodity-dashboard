<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Commodity Dashboard — Procurement Controlling</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.32.0/plotly.min.js"></script>
<style>
:root{--bg:#0d1117;--sur:#161b22;--sur2:#1c2330;--bor:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#d4a843;--acc2:#3b7fd4;--r:6px;--font:'Inter','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100vh;height:100dvh;max-height:100dvh;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
header{padding:0 18px;height:84px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:url('./banner_preview.png') center center/cover no-repeat,var(--sur);position:relative}
.logo{font-size:17px;font-weight:700;color:var(--acc);letter-spacing:-.3px;text-shadow:0 1px 6px rgba(0,0,0,.9);position:relative}
.logo span{color:#c9d4e0;font-weight:400;font-size:11px;margin-left:6px;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#lu{margin-left:auto;font-size:10px;color:#c9d4e0;font-family:var(--mono);text-shadow:0 1px 4px rgba(0,0,0,.9);position:relative}
.hamburger{display:none;background:transparent;border:1px solid var(--bor);border-radius:var(--r);padding:5px 9px;cursor:pointer;color:var(--mut);font-size:16px;line-height:1;flex-shrink:0}

/* Shell */
.shell{display:flex;flex:1;min-height:0;overflow:hidden}

/* Sidebar */
aside{width:200px;flex-shrink:0;background:var(--sur);border-right:1px solid var(--bor);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:12px}
.sb-act{display:flex;gap:4px}
.btn{font-size:10px;padding:3px 8px;border-radius:var(--r);border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.sb-sec h3{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 3px 5px;border-bottom:1px solid var(--bor);margin-bottom:5px}
.cat-lbl{font-size:9px;color:var(--mut);padding:4px 3px 2px;text-transform:uppercase;letter-spacing:.04em}
.si{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:var(--r);cursor:pointer;transition:background .1s;user-select:none}
.si:hover{background:var(--sur2)}
.sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sl{font-size:11px;flex:1;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tag{font-size:8px;color:var(--acc2);background:rgba(59,127,212,.15);border:1px solid rgba(59,127,212,.3);padding:0 4px;border-radius:3px;flex-shrink:0}
.sret{font-size:9px;font-family:var(--mono);flex-shrink:0;margin-left:auto;padding-left:4px}
.sret.up{color:#3fb950}
.sret.dn{color:#f85149}
.si.off .sl{color:var(--mut)}
.si.off .sw{opacity:.2}

/* Overlay for mobile */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49}
.overlay.vis{display:block}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* Controls row */
.ctrl{display:flex;align-items:center;gap:7px;padding:5px 14px;border-bottom:1px solid var(--bor);flex-shrink:0;flex-wrap:wrap}
.cl{font-size:10px;color:var(--mut)}
.rb{font-size:10px;padding:3px 9px;border-radius:var(--r);border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;transition:all .12s}
.rb:hover,.rb.active{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.nw{margin-left:auto;display:flex;align-items:center;gap:6px}
.nl{font-size:10px;color:var(--mut)}
.tgl{position:relative;width:32px;height:17px}
.tgl input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:var(--bor);border-radius:17px;cursor:pointer;transition:background .2s}
.tsl::before{content:'';position:absolute;width:11px;height:11px;left:3px;top:3px;background:var(--mut);border-radius:50%;transition:transform .2s,background .2s}
input:checked+.tsl{background:var(--acc2)}
input:checked+.tsl::before{transform:translateX(15px);background:#fff}

/* Bar filter row */
.bctrl{display:flex;align-items:center;gap:5px;padding:3px 14px;border-bottom:1px solid var(--bor);flex-shrink:0;flex-wrap:wrap;background:var(--sur)}
.bctrl .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.bb{font-size:9px;padding:2px 7px;border-radius:var(--r);border:1px solid var(--bor);background:transparent;color:var(--mut);cursor:pointer;transition:all .12s}
.bb:hover,.bb.active{border-color:var(--acc2);color:var(--acc2);background:rgba(59,127,212,.1)}

/* Single chart container — fills all remaining space */
.charts{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
#plt{flex:1;min-height:0;min-width:0}

/* Draggable divider between the two charts */
#divider{
  position:absolute; left:0; right:0; height:14px;
  cursor:row-resize; z-index:20;
  display:flex; align-items:center; justify-content:center;
}
#divider::before{
  content:''; width:60px; height:4px; border-radius:2px;
  background:var(--bor); transition:background .15s;
}
#divider:hover::before{ background:var(--acc); }
#divider.dragging::before{ background:var(--acc); }

/* Overlay/loading */
.ov{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--mut);font-size:12px;text-align:center}
.ov .ic{font-size:26px}
.ov code{font-family:var(--mono);font-size:10px;background:var(--sur2);padding:5px 10px;border-radius:var(--r);border:1px solid var(--bor);color:var(--acc)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:2px}

/* ── Mobile ── */
@media(max-width:900px){
  .hamburger{display:block}
  .logo span{display:none}
  #lu{font-size:9px}
  header{padding:0 12px;height:64px}
  .logo{font-size:14px}

  aside{
    position:fixed;top:0;left:0;bottom:0;
    z-index:50;width:220px;
    transform:translateX(-100%);
    transition:transform .25s ease;
    padding-top:50px;
  }
  aside.open{transform:translateX(0)}

  .ctrl{padding:5px 8px;gap:5px}
  .rb{padding:4px 8px;font-size:11px}
  .nl{display:none}
  .bctrl{padding:4px 8px;gap:4px}
  .bb{padding:3px 7px;font-size:10px}

  /* Landscape: more compact header to save vertical space */
  @media(orientation:landscape){
    header{height:52px}
    .logo{font-size:13px}
    .ctrl{padding:3px 8px}
    .bctrl{padding:2px 8px}
  }
}
</style>
</head>
<body>

<header>
  <button class="hamburger" id="hbg">☰</button>
  <div class="logo" style="display:none">Commodity Dashboard <span>Procurement Controlling</span></div>
  <div id="lu">—</div>
</header>

<div class="overlay" id="ov"></div>

<div class="shell">
  <aside id="sb">
    <div class="sb-act">
      <button class="btn" onclick="toggleAll(true)">All ON</button>
      <button class="btn" onclick="toggleAll(false)">All OFF</button>
    </div>
    <div class="sb-sec"><h3>Commodities</h3><div id="clist"></div></div>
    <div class="sb-sec"><h3>Financial Indicators</h3><div id="ilist"></div></div>
  </aside>

  <main>
    <div class="ctrl">
      <span class="cl">Period:</span>
      <button class="rb" data-y="1">1Y</button>
      <button class="rb" data-y="2">2Y</button>
      <button class="rb" data-y="5">5Y</button>
      <button class="rb active" data-y="10">10Y</button>
      <div class="nw">
        <span class="nl">Forecast</span>
        <label class="tgl"><input type="checkbox" id="fc"><span class="tsl"></span></label>
        <span class="nl" style="margin-left:12px">Normalized (base=100)</span>
        <label class="tgl"><input type="checkbox" id="nt"><span class="tsl"></span></label>
      </div>
    </div>

    <div class="bctrl">
      <span class="lbl">Macro:</span>
      <button class="bb active" data-bc="all">All</button>
      <button class="bb" data-bc="Interest Rates">Rates</button>
      <button class="bb" data-bc="GDP">GDP</button>
      <button class="bb" data-bc="Inflation">Inflation</button>
      <button class="bb" data-bc="PMI">PMI</button>
    </div>

    <div class="charts">
      <div id="plt" style="width:100%;height:100%">
        <div class="ov" id="loading"><div class="ic">⏳</div><p>Loading data…</p></div>
      </div>
      <div id="divider"></div>
    </div>
  </main>
</div>

<script>
const PAL=['#d4a843','#3b7fd4','#3fb950','#e05c5c','#a371f7','#f0883e','#56d3c8','#ff7eb6','#7ee787','#79c0ff','#ffa657','#d2a8ff','#ff9492','#86efac','#b3d4f5','#ffe680','#98d8c8','#f9a8d4','#c4b5fd','#6e7681','#c9d1d9','#58a6ff'];

// Fixed, high-contrast colors for specific series (so overlapping bars stay distinct)
const FIXED_COLORS={
  // Interest rates — cool tones
  'Fed Funds Rate':'#3b7fd4',          // blue
  'ECB Main Refinancing Rate':'#d4a843',// gold
  // Inflation — warm tones (contrast vs rates)
  'US Inflation (CPI YoY)':'#e05c5c',  // red
  'EU Inflation (CPI YoY)':'#f0883e',  // orange
  // GDP — green tones
  'US GDP Growth':'#3fb950',           // green
  'EU GDP Growth':'#56d3c8',           // teal
  // FOMC projections — lighter variants of their actual-series colors
  'Fed Funds (FOMC Projection)':'#79c0ff',
  'US Inflation PCE (FOMC Projection)':'#ff9492',
  'US GDP (FOMC Projection)':'#7ee787',
};
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
// Each projection is tied to its actual series — shown only when that series is selected
const PROJ_PARENT={
  'Fed Funds (FOMC Projection)':'Fed Funds Rate',
  'US Inflation PCE (FOMC Projection)':'US Inflation (CPI YoY)',
  'US GDP (FOMC Projection)':'US GDP Growth',
};
let all=[], activeY=10, norm=false, barCat='all', ci=0, fcast=false;
let splitPos=0.36; // boundary between line (top) and bar (bottom), 0..1

// Hamburger
const sb=document.getElementById('sb'), ov=document.getElementById('ov');
document.getElementById('hbg').addEventListener('click',()=>{sb.classList.toggle('open');ov.classList.toggle('vis');});
ov.addEventListener('click',()=>{sb.classList.remove('open');ov.classList.remove('vis');});

async function loadData(){
  try{
    const cb='?v='+Date.now();  // cache-busting: always load fresh JSON
    const [cr,ir]=await Promise.all([fetch('./data/commodities.json'+cb,{cache:'no-store'}),fetch('./data/indicators.json'+cb,{cache:'no-store'})]);
    if(!cr.ok||!ir.ok) throw new Error();
    const [cd,id]=await Promise.all([cr.json(),ir.json()]);
    document.getElementById('lu').textContent=cd.meta?.fetched_at?'Updated: '+new Date(cd.meta.fetched_at).toLocaleString('en-GB'):'';
    all=[];
    for(const s of cd.series) all.push({...s,sidebarType:'commodity',color:PAL[ci++%PAL.length],active:s.default_on===true});
    for(const s of id.series) all.push({...s,sidebarType:'indicator',color:FIXED_COLORS[s.label]||PAL[ci++%PAL.length],active:s.default_on===true});
    buildSidebar(); renderAll();
  }catch(e){showErr();}
}

function buildSidebar(){
  const cl=document.getElementById('clist'),il=document.getElementById('ilist');
  cl.innerHTML='';il.innerHTML='';
  const g={};
  for(const s of all){if(s.is_projection)continue;const k=s.sidebarType+'::'+s.category;(g[k]??=[]).push(s);}
  for(const[k,items]of Object.entries(g)){
    const[sType,cat]=k.split('::');
    const t=sType==='commodity'?cl:il;
    const ce=document.createElement('div');ce.className='cat-lbl';ce.textContent=cat;t.appendChild(ce);
    for(const s of items){
      const el=document.createElement('div');
      el.className='si'+(s.active?'':' off');
      el.innerHTML=`<div class="sw" style="background:${s.color}"></div><span class="sl">${s.label}</span>${s.chart_type==='bar'?'<span class="bar-tag">BAR</span>':'<span class="sret"></span>'}`;
      el.addEventListener('click',()=>{s.active=!s.active;el.classList.toggle('off',!s.active);renderAll();});
      s._retEl=el.querySelector('.sret');
      t.appendChild(el);
    }
  }
  updateSidebarReturns();
}

// % return over the displayed period, next to each series in the sidebar
function updateSidebarReturns(){
  for(const s of all){
    if(!s._retEl)continue;
    const p=pctRet(filterY(s.data));
    if(p===null){s._retEl.textContent='';continue;}
    s._retEl.textContent=`${p>=0?'+':''}${p.toFixed(1)}%`;
    s._retEl.className='sret '+(p>=0?'up':'dn');
  }
}

function toggleAll(on){all.forEach(s=>s.active=on);document.querySelectorAll('.si').forEach(el=>el.classList.toggle('off',!on));renderAll();}

function filterY(data){const cut=new Date();cut.setFullYear(cut.getFullYear()-activeY);return data.filter(d=>new Date(d.date)>=cut);}
function normalise(data){if(!data.length)return data;const b=data[0].value;if(!b)return data;return data.map(d=>({...d,value:Math.round(d.value/b*10000)/100}));}
// A projection shows only if Forecast is on AND its parent series is selected
function projOn(s){
  if(!s.is_projection)return false;
  if(!fcast)return false;
  const p=PROJ_PARENT[s.label];
  if(!p)return false;
  const parent=all.find(x=>x.label===p);
  return !!(parent&&parent.active);
}
// % return over the currently displayed period
function pctRet(d){
  if(d.length<2)return null;
  const a=d[0].value,b=d[d.length-1].value;
  if(!a)return null;
  return (b/a-1)*100;
}
function retTag(d){
  const p=pctRet(d);
  if(p===null)return '';
  return `  ${p>=0?'+':''}${p.toFixed(1)}%`;
}

function axStyle(){return{gridcolor:'#21262d',linecolor:'#30363d',zerolinecolor:'#30363d',tickcolor:'#30363d',tickfont:{color:'#8b949e',size:10}};}
const CFG={responsive:true,displayModeBar:true,modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d'],displaylogo:false,toImageButtonOptions:{format:'png',filename:'commodity_dashboard',scale:2}};

function renderAll(){
  updateSidebarReturns();
  const plt=document.getElementById('plt');
  const lines=all.filter(s=>s.active&&s.chart_type!=='bar');
  let bars=all.filter(s=>s.chart_type==='bar'&&(s.is_projection?projOn(s):s.active));
  if(barCat!=='all')bars=bars.filter(s=>s.category===barCat);

  if(!lines.length&&!bars.length){
    Plotly.purge('plt');
    plt.innerHTML=`<div class="ov"><div class="ic">📊</div><p>Select at least one series from the sidebar.</p></div>`;
    return;
  }
  // Clear any overlay leftover
  if(plt.querySelector('.ov')) plt.innerHTML='';

  const hasBar = bars.length>0;
  const traces=[];

  // Line traces → top subplot (y axis)
  for(const s of lines){
    const raw=filterY(s.data);
    const base=(norm&&raw.length&&raw[0].value)?raw[0].value:null;
    const nz=v=>base?Math.round(v/base*10000)/100:v;
    const d=base?raw.map(r=>({...r,value:nz(r.value)})):raw;
    traces.push({
      x:d.map(r=>r.date), y:d.map(r=>r.value),
      name:s.label+retTag(raw), type:'scatter', mode:'lines',
      xaxis:'x', yaxis:'y',
      line:{color:s.color,width:1.5},
      hovertemplate:`<b>${s.label}</b><br>%{x}<br>%{y:.2f} ${norm?'(base=100)':s.unit}<extra></extra>`
    });
    // Fan chart — statistical projection bands (Forecast mode)
    if(fcast && s.fan){
      const f=s.fan, xr=[...f.dates].reverse();
      const B=arr=>arr.map(nz);
      traces.push({x:[...f.dates,...xr], y:[...B(f.hi90),...B([...f.lo90].reverse())],
        type:'scatter', fill:'toself', fillcolor:hexA(s.color,0.09),
        line:{width:0}, showlegend:false, hoverinfo:'skip', xaxis:'x', yaxis:'y', name:s.label+' 90%'});
      traces.push({x:[...f.dates,...xr], y:[...B(f.hi50),...B([...f.lo50].reverse())],
        type:'scatter', fill:'toself', fillcolor:hexA(s.color,0.16),
        line:{width:0}, showlegend:false, hoverinfo:'skip', xaxis:'x', yaxis:'y', name:s.label+' 50%'});
      const last=d[d.length-1];
      traces.push({x:[last?last.date:f.dates[0],...f.dates], y:[last?last.value:nz(f.median[0]),...B(f.median)],
        type:'scatter', mode:'lines', line:{color:s.color,width:1.2,dash:'dot'},
        showlegend:false, xaxis:'x', yaxis:'y', name:s.label+' proj.',
        hovertemplate:`<b>${s.label} — projection</b><br>%{x}<br>median %{y:.2f} ${norm?'(base=100)':s.unit}<extra></extra>`});
    }
  }
  // Bar traces → bottom subplot (y2 axis)
  for(const s of bars){
    const d=filterY(s.data);
    traces.push({
      x:d.map(r=>r.date), y:d.map(r=>r.value),
      name:s.label, type:'bar', opacity:s.is_projection?0.45:0.6,
      xaxis:'x', yaxis:'y2',
      marker:s.is_projection
        ?{color:s.color, pattern:{shape:'/', size:4, solidity:0.4}, line:{color:s.color, width:0.5}}
        :{color:s.color, line:{color:s.color, width:0.5}},
      hovertemplate:`<b>${s.label}</b><br>%{x}<br>%{y:.2f} ${s.unit}<extra></extra>`
    });
  }

  const mob=window.innerWidth<=900;

  const layout={
    autosize:true,
    paper_bgcolor:'#0d1117', plot_bgcolor:'#0d1117',
    font:{family:'Inter,system-ui,sans-serif',color:'#8b949e',size:11},
    hovermode:'x unified',
    hoverlabel:{bgcolor:'#1c2330',bordercolor:'#30363d',font:{size:11}},
    barmode:'overlay',
    showlegend:true,
    legend:{bgcolor:'#161b22',bordercolor:'#30363d',borderwidth:1,font:{size:10},
            orientation:'h', x:0, y:1.04, yanchor:'bottom'},
    margin:{t:34, r:16, b:fcast?56:40, l:52},

    // Shared X axis (anchored to the bottom-most subplot)
    xaxis:{...axStyle(), anchor: hasBar?'y2':'y'},

    // Top subplot — line chart
    yaxis:{...axStyle(),
      domain: hasBar?[0.40,1]:[0,1],
      title:{text: norm?'Index (base=100)':'Price', font:{size:10}}},
  };

  if(fcast){
    const anyCurve=lines.some(s=>s.fan&&s.fan.source==='futures');
    const midTxt=anyCurve
      ?'Dotted line: futures curve (what the market pays today for forward delivery — not a forecast)'
      :'Dotted line: last price carried forward (no futures chain available)';
    layout.annotations=[{
      text:midTxt+' · Bands: 50% / 90% statistical range from historical volatility · Hatched bars: official FOMC median projections',
      showarrow:false, xref:'paper', yref:'paper', x:0, y:-0.09, xanchor:'left',
      font:{size:9, color:'#8b949e'}
    }];
  }

  if(hasBar){
    // splitPos controls the boundary; gap of 0.08 between subplots
    const gap=0.08;
    const lineBottom = Math.min(0.95, Math.max(0.25, splitPos)) ;
    layout.yaxis.domain = [lineBottom, 1];
    layout.yaxis2={...axStyle(),
      domain:[0, Math.max(0.05, lineBottom-gap)],
      title:{text:'%', font:{size:10}}};
  }

  Plotly.react('plt', traces, layout, CFG);
}

document.querySelectorAll('.rb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.rb').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeY=parseInt(b.dataset.y);renderAll();}));
document.getElementById('nt').addEventListener('change',e=>{norm=e.target.checked;renderAll();});
document.getElementById('fc').addEventListener('change',e=>{fcast=e.target.checked;renderAll();});
document.querySelectorAll('.bb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.bb').forEach(x=>x.classList.remove('active'));b.classList.add('active');barCat=b.dataset.bc;renderAll();}));

let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{sb.classList.remove('open');ov.classList.remove('vis');renderAll();},200);});

function showErr(){document.getElementById('plt').innerHTML=`<div class="ov"><div class="ic">⚠️</div><p>Data files not found.<br>Run the Python script first:</p><code>python scripts/fetch_data.py</code></div>`;}

// ── Draggable divider ────────────────────────────────────────────────────────
const divider=document.getElementById('divider');
const chartsEl=document.querySelector('.charts');

function positionDivider(){
  // Only show divider when bar chart is visible
  const bars=all.filter(s=>s.chart_type==='bar'&&(s.is_projection?projOn(s):s.active));
  const showBars = barCat==='all' ? bars.length>0 : bars.filter(s=>s.category===barCat).length>0;
  if(!showBars){ divider.style.display='none'; return; }
  divider.style.display='flex';
  // Plotly domain is measured from bottom; convert to top-offset in px
  const h=chartsEl.clientHeight;
  // boundary y (from top) = (1 - splitPos) * plottable height; approximate with full height
  const topPx = (1 - splitPos) * h;
  divider.style.top = (topPx - 7) + 'px';
}

let dragging=false;
divider.addEventListener('mousedown',e=>{dragging=true;divider.classList.add('dragging');e.preventDefault();});
divider.addEventListener('touchstart',e=>{dragging=true;divider.classList.add('dragging');},{passive:true});

function onMove(clientY){
  if(!dragging) return;
  const rect=chartsEl.getBoundingClientRect();
  let frac = (clientY - rect.top) / rect.height; // 0 at top, 1 at bottom
  // splitPos is the line-chart bottom (domain), measured from bottom => 1 - frac
  splitPos = Math.min(0.90, Math.max(0.20, 1 - frac));
  renderAll();
  positionDivider();
}
window.addEventListener('mousemove',e=>onMove(e.clientY));
window.addEventListener('touchmove',e=>{if(dragging&&e.touches[0])onMove(e.touches[0].clientY);},{passive:true});
window.addEventListener('mouseup',()=>{dragging=false;divider.classList.remove('dragging');});
window.addEventListener('touchend',()=>{dragging=false;divider.classList.remove('dragging');});

// Reposition divider after each render and on resize
const _origRenderAll = renderAll;
renderAll = function(){ _origRenderAll(); setTimeout(positionDivider, 50); };

window.addEventListener('resize',()=>setTimeout(positionDivider,250));

loadData();
</script>
</body>
</html>
