<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 160" width="1600" height="160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Commodity Dashboard — metals markets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0f16"/>
      <stop offset="45%"  stop-color="#131a26"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2d98b"/>
      <stop offset="35%"  stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#6d4f14"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e2a17a"/>
      <stop offset="40%"  stop-color="#b87333"/>
      <stop offset="100%" stop-color="#5c3617"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8eef5"/>
      <stop offset="40%"  stop-color="#9aa7b4"/>
      <stop offset="100%" stop-color="#48525d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#d4a843" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="42%"  stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0%"   stop-color="#d4a843" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="160"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="160" fill="url(#bg)"/>
    <rect width="1600" height="160" fill="url(#heat)"/>

    <!-- grid -->
    <g stroke="#22303f" stroke-width="1" opacity="0.5">
      <line x1="0" y1="40"  x2="1600" y2="40"/>
      <line x1="0" y1="80"  x2="1600" y2="80"/>
      <line x1="0" y1="120" x2="1600" y2="120"/>
      <g opacity="0.7">
        <line x1="200"  y1="0" x2="200"  y2="160"/>
        <line x1="400"  y1="0" x2="400"  y2="160"/>
        <line x1="600"  y1="0" x2="600"  y2="160"/>
        <line x1="800"  y1="0" x2="800"  y2="160"/>
        <line x1="1000" y1="0" x2="1000" y2="160"/>
        <line x1="1200" y1="0" x2="1200" y2="160"/>
        <line x1="1400" y1="0" x2="1400" y2="160"/>
      </g>
    </g>

    <!-- volume bars -->
    <g fill="#3b7fd4" opacity="0.22">
      <rect x="70"   y="132" width="9" height="28"/>
      <rect x="110"  y="124" width="9" height="36"/>
      <rect x="150"  y="138" width="9" height="22"/>
      <rect x="190"  y="118" width="9" height="42"/>
      <rect x="230"  y="130" width="9" height="30"/>
      <rect x="270"  y="112" width="9" height="48"/>
      <rect x="310"  y="126" width="9" height="34"/>
      <rect x="350"  y="136" width="9" height="24"/>
      <rect x="390"  y="120" width="9" height="40"/>
      <rect x="430"  y="128" width="9" height="32"/>
      <rect x="470"  y="114" width="9" height="46"/>
      <rect x="510"  y="134" width="9" height="26"/>
    </g>

    <!-- price area + line -->
    <path d="M0,118 L60,112 L120,120 L180,102 L240,108 L300,88 L360,96 L420,74 L480,84 L540,62 L600,70 L660,52 L720,60 L780,44 L840,50 L900,34 L960,42 L1020,30 L1080,38 L1140,24 L1200,32 L1260,20 L1320,28 L1380,18 L1440,26 L1500,14 L1600,22 L1600,160 L0,160 Z"
          fill="url(#glow)"/>
    <path d="M0,118 L60,112 L120,120 L180,102 L240,108 L300,88 L360,96 L420,74 L480,84 L540,62 L600,70 L660,52 L720,60 L780,44 L840,50 L900,34 L960,42 L1020,30 L1080,38 L1140,24 L1200,32 L1260,20 L1320,28 L1380,18 L1440,26 L1500,14 L1600,22"
          fill="none" stroke="#d4a843" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

    <!-- candlesticks -->
    <g opacity="0.5">
      <g stroke="#3fb950" stroke-width="1.5" fill="#3fb950">
        <line x1="1245" y1="52" x2="1245" y2="96"/><rect x="1239" y="62" width="12" height="26" rx="1"/>
        <line x1="1305" y1="44" x2="1305" y2="88"/><rect x="1299" y="54" width="12" height="24" rx="1"/>
        <line x1="1425" y1="40" x2="1425" y2="82"/><rect x="1419" y="48" width="12" height="26" rx="1"/>
      </g>
      <g stroke="#f85149" stroke-width="1.5" fill="#f85149">
        <line x1="1275" y1="48" x2="1275" y2="94"/><rect x="1269" y="58" width="12" height="28" rx="1"/>
        <line x1="1365" y1="46" x2="1365" y2="90"/><rect x="1359" y="56" width="12" height="22" rx="1"/>
      </g>
    </g>

    <!-- ingot stack: gold -->
    <g transform="translate(1000,72)">
      <path d="M18,64 L118,64 L104,40 L32,40 Z"  fill="url(#gold)"/>
      <path d="M32,40 L104,40 L104,34 L32,34 Z"  fill="#f2d98b" opacity="0.55"/>
      <path d="M-4,34 L84,34 L70,10 L10,10 Z"    fill="url(#gold)" opacity="0.92"/>
      <path d="M10,10 L70,10 L70,4 L10,4 Z"      fill="#f2d98b" opacity="0.5"/>
      <path d="M46,4 L134,4 L120,-20 L60,-20 Z"  fill="url(#gold)" opacity="0.85"/>
    </g>

    <!-- ingot stack: copper -->
    <g transform="translate(1180,88)">
      <path d="M14,48 L106,48 L93,26 L27,26 Z" fill="url(#copper)"/>
      <path d="M27,26 L93,26 L93,20 L27,20 Z"  fill="#e2a17a" opacity="0.5"/>
      <path d="M0,20 L80,20 L67,-2 L13,-2 Z"   fill="url(#copper)" opacity="0.88"/>
    </g>

    <!-- ingot: silver -->
    <g transform="translate(1348,104)">
      <path d="M10,40 L92,40 L80,20 L22,20 Z" fill="url(#silver)" opacity="0.75"/>
      <path d="M22,20 L80,20 L80,14 L22,14 Z" fill="#e8eef5" opacity="0.4"/>
    </g>

    <!-- left fade so header text stays readable -->
    <rect width="1600" height="160" fill="url(#fade)"/>
    <rect x="0" y="158" width="1600" height="2" fill="#d4a843" opacity="0.35"/>
  </g>
</svg>
